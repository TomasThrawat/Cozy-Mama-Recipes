name: Shared Flutter Quality and Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-quality-and-security:
    uses: TomasThrawat/hyouka-flutter-workflows/.github/workflows/flutter-ci.yml@v1.1.7
    with:
      run-analyze: true
      run-tests: true
      run-screenshot-tests: true
      generate-coverage-report: true
      check-format: false
      build-apk: true
      target-platform: android-arm64
      generate-android: true
      android-project-name: cozy_mama_recipes
      android-organization: com.hyouka
      run-emulator-tests: false
      run-security-audit: true
      fail-on-security-findings: false
      artifact-name: central-integration-test-arm64-apk
