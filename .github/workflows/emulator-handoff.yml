name: Emulator handoff

on:
  push:
    paths:
      - .github/workflows/emulator-handoff.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-24.04
    steps:
      - name: Download verified APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p handoff
          curl --fail --silent --show-error --location             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/11576130538/zip"             -o /tmp/artifact.zip
          unzip -o /tmp/artifact.zip -d handoff >/dev/null
          test -f handoff/app-release.apk
          rm -f /tmp/artifact.zip

      - name: Verify artifact digest
        run: |
          set -euo pipefail
          APK_SHA256="$(sha256sum handoff/app-release.apk | awk '{print $1}')"
          echo "APK SHA256: $APK_SHA256"
          test "$APK_SHA256" = "102e4863ae0c9c83ec31af2a3d217240de864d3426a88d122b7f82a2b49ef5a5"
          unzip -Z1 handoff/app-release.apk | grep -E '^lib/[^/]+/.*\.so

      - name: Publish temporary release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="emulator-handoff-572a122"
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"

          curl --fail --silent --show-error             -X DELETE             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "$API/releases/tags/$TAG" >/dev/null || true

          curl --fail --silent --show-error             -X DELETE             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "$API/git/refs/tags/$TAG" >/dev/null || true

          RELEASE_JSON="$(curl --fail --silent --show-error             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             -H "Content-Type: application/json"             "$API/releases"             -d '{
              "tag_name":"emulator-handoff-572a122",
              "target_commitish":"572a122a9bfdf5504951363276aaca14452dd2f8",
              "name":"Emulator handoff",
              "body":"Temporary verified APK handoff.",
              "draft":false,
              "prerelease":true
            }')"

          RELEASE_ID="$(printf '%s' "$RELEASE_JSON" | jq -r '.id')"
          test "$RELEASE_ID" != "null"
          test -n "$RELEASE_ID"

          curl --fail --silent --show-error             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             -H "Content-Type: application/vnd.android.package-archive"             --data-binary @handoff/app-release.apk             "$API/releases/$RELEASE_ID/assets?name=app-release.apk" >/tmp/asset.json

          printf '%s
' "$RELEASE_JSON" >/tmp/release.json
          jq -r '.browser_download_url' /tmp/asset.json
 | awk -F/ '{print $2}' | sort -u | grep -Fx "arm64-v8a"
          if unzip -Z1 handoff/app-release.apk | grep -E '^lib/[^/]+/.*\.so

      - name: Publish temporary release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="emulator-handoff-572a122"
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"

          curl --fail --silent --show-error             -X DELETE             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "$API/releases/tags/$TAG" >/dev/null || true

          curl --fail --silent --show-error             -X DELETE             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "$API/git/refs/tags/$TAG" >/dev/null || true

          RELEASE_JSON="$(curl --fail --silent --show-error             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             -H "Content-Type: application/json"             "$API/releases"             -d '{
              "tag_name":"emulator-handoff-572a122",
              "target_commitish":"572a122a9bfdf5504951363276aaca14452dd2f8",
              "name":"Emulator handoff",
              "body":"Temporary verified APK handoff.",
              "draft":false,
              "prerelease":true
            }')"

          RELEASE_ID="$(printf '%s' "$RELEASE_JSON" | jq -r '.id')"
          test "$RELEASE_ID" != "null"
          test -n "$RELEASE_ID"

          curl --fail --silent --show-error             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             -H "Content-Type: application/vnd.android.package-archive"             --data-binary @handoff/app-release.apk             "$API/releases/$RELEASE_ID/assets?name=app-release.apk" >/tmp/asset.json

          printf '%s
' "$RELEASE_JSON" >/tmp/release.json
          jq -r '.browser_download_url' /tmp/asset.json
 | awk -F/ '{print $2}' | sort -u | grep -vFx "arm64-v8a"; then
            echo "Non-arm64-v8a native library found"
            exit 1
          fi

      - name: Publish temporary release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="emulator-handoff-572a122"
          API="https://api.github.com/repos/$GITHUB_REPOSITORY"

          curl --fail --silent --show-error             -X DELETE             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "$API/releases/tags/$TAG" >/dev/null || true

          curl --fail --silent --show-error             -X DELETE             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "$API/git/refs/tags/$TAG" >/dev/null || true

          RELEASE_JSON="$(curl --fail --silent --show-error             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             -H "Content-Type: application/json"             "$API/releases"             -d '{
              "tag_name":"emulator-handoff-572a122",
              "target_commitish":"572a122a9bfdf5504951363276aaca14452dd2f8",
              "name":"Emulator handoff",
              "body":"Temporary verified APK handoff.",
              "draft":false,
              "prerelease":true
            }')"

          RELEASE_ID="$(printf '%s' "$RELEASE_JSON" | jq -r '.id')"
          test "$RELEASE_ID" != "null"
          test -n "$RELEASE_ID"

          curl --fail --silent --show-error             -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             -H "Content-Type: application/vnd.android.package-archive"             --data-binary @handoff/app-release.apk             "$API/releases/$RELEASE_ID/assets?name=app-release.apk" >/tmp/asset.json

          printf '%s
' "$RELEASE_JSON" >/tmp/release.json
          jq -r '.browser_download_url' /tmp/asset.json
