name: Flutter APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: 2
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  GIT_CONFIG_KEY_1: advice.defaultBranchName
  GIT_CONFIG_VALUE_1: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android files
        run: flutter create --platforms=android --project-name cozy_mama_recipes .
      - name: Apply cozy launcher icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp assets/cozy_icon.xml android/app/src/main/res/drawable/cozy_icon.xml
          sed -i 's#android:icon="@mipmap/ic_launcher"#android:icon="@drawable/cozy_icon"#' android/app/src/main/AndroidManifest.xml
      - name: Enforce arm64-only Android build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle.kts')
          text = path.read_text()
          needle = '    defaultConfig {\n'
          if needle not in text:
              raise SystemExit('defaultConfig block not found')
          text = text.replace(needle, needle + '        ndk {\n            abiFilters.clear()\n            abiFilters.addAll(listOf("arm64-v8a"))\n        }\n', 1)
          path.write_text(text)
          PY
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build arm64 APK
        run: flutter build apk --release --target-platform android-arm64
      - name: Verify APK contains arm64-v8a only
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          ABIS="$(unzip -Z1 "$APK" | awk -F/ '/^lib\/[^/]+\/.*\.so$/ {print $2}' | sort -u | tr '\n' ' ' | xargs)"
          echo "APK native ABIs: \${ABIS:-none}"
          if [ "$ABIS" != "arm64-v8a" ]; then
            echo "Expected exactly arm64-v8a but found: $ABIS"
            exit 1
          fi
          if unzip -Z1 "$APK" | grep -E '^lib/[^/]+/' | grep -v '^lib/arm64-v8a/'; then
            echo "Found a non-arm64-v8a native library"
            exit 1
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: cozy-mama-recipes-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error